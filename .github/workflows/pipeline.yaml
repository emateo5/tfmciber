name: Automatizacion de Escaneo de Vulnerabilidad & Triaje con IA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      experiment_scenario:
        description: "Escenario experimental"
        required: true
        default: tuned-ai
        type: choice
        options:
          - baseline
          - stock
          - tuned
          - tuned-ai
      target_url:
        description: "URL HTTP(S) autorizada para el escaneo"
        required: true
        default: http://localhost:3000
        type: string

jobs:
  security-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPERIMENT_SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment_scenario || 'baseline' }}
      TARGET_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.target_url || 'http://localhost:3000' }}
      ZAP_IMAGE: zaproxy/zap-stable
      ZAP_TUNED_IMAGE: tfmciber/zap-chromium:2.17.0

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v5

    - name: Run SAST checks
      run: |
        mkdir -p artifacts
        python -m pip install --upgrade pip
        python -m pip install bandit pip-audit
        bandit -r . -x .git,zap/node_modules -f json -o artifacts/sast-bandit.json || bandit_status=$?
        pip-audit -r requirements.txt -f json -o artifacts/sast-pip-audit.json || pip_audit_status=$?
        python -m py_compile triage_vulner.py
        if [ "${bandit_status:-0}" -ne 0 ] || [ "${pip_audit_status:-0}" -ne 0 ]; then
          echo "SAST ha encontrado hallazgos; se conservan los informes para el PoC."
        fi
      continue-on-error: true

    - name: Validate target URL
      env:
        TARGET_URL: ${{ env.TARGET_URL }}
      run: |
        python - <<'PY'
        import ipaddress
        import os
        import socket
        from urllib.parse import urlparse

        target = urlparse(os.environ["TARGET_URL"])
        if target.scheme not in {"http", "https"} or not target.hostname:
            raise SystemExit("TARGET_URL debe ser una URL HTTP(S) con host.")
        if target.username or target.password or target.fragment:
            raise SystemExit("TARGET_URL no puede contener credenciales ni fragmentos.")
        if target.hostname in {"localhost", "localhost.localdomain"}:
          pass
        else:
            try:
                addresses = {item[4][0] for item in socket.getaddrinfo(target.hostname, None)}
            except socket.gaierror as error:
                raise SystemExit(f"No se pudo resolver el host: {error}")
            for address in addresses:
                parsed_address = ipaddress.ip_address(address)
                if (parsed_address.is_private or parsed_address.is_loopback
                        or parsed_address.is_link_local or parsed_address.is_reserved):
                    raise SystemExit("No se permiten hosts privados o internos.")
        print(f"Objetivo validado: {target.scheme}://{target.hostname}")
        PY

    - name: Start OWASP Juice Shop (Target)
      if: env.TARGET_URL == 'http://localhost:3000'
      run: |
        docker run -d -p 3000:3000 --name juice-shop-instance bkimminich/juice-shop

    - name: Wait for target
      run: |
        echo "Esperando a que el objetivo esté disponible..."
        for attempt in {1..30}; do
          if curl --output /dev/null --silent --show-error --fail --max-time 10 "$TARGET_URL"; then
            echo "Objetivo disponible: $TARGET_URL"
            exit 0
          fi
          printf '.'
          sleep 5
        done
        echo "El objetivo no respondió a tiempo: $TARGET_URL"
        exit 1

    - name: Run OWASP ZAP Baseline Scan (Passive)
      if: env.EXPERIMENT_SCENARIO == 'baseline'
      run: |
        mkdir -p artifacts
        docker run --rm --network="host" --user root -v "$(pwd):/zap/wrk/:rw" \
          "$ZAP_IMAGE" zap-baseline.py \
          -t "$TARGET_URL" -J artifacts/zap-baseline.json -r artifacts/zap-baseline.html
      continue-on-error: true

    - name: Run OWASP ZAP Stock Scan
      if: env.EXPERIMENT_SCENARIO == 'stock'
      run: |
        mkdir -p artifacts
        docker run --rm --network="host" --user root -v "$(pwd):/zap/wrk/:rw" \
          "$ZAP_IMAGE" zap-full-scan.py \
          -t "$TARGET_URL" -J artifacts/zap-stock.json -r artifacts/zap-stock.html
      continue-on-error: true

    - name: Set up Node.js for browser discovery
      if: env.EXPERIMENT_SCENARIO == 'tuned' || env.EXPERIMENT_SCENARIO == 'tuned-ai'
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build ZAP image with Chromium
      if: env.EXPERIMENT_SCENARIO == 'tuned' || env.EXPERIMENT_SCENARIO == 'tuned-ai'
      run: |
        set -o pipefail
        docker build --tag "$ZAP_TUNED_IMAGE" zap 2>&1 | tee artifacts/zap-image-build.log

    - name: Install browser discovery dependency
      if: env.EXPERIMENT_SCENARIO == 'tuned' || env.EXPERIMENT_SCENARIO == 'tuned-ai'
      run: |
        npm install --no-save playwright
        npx playwright install --with-deps chromium

    - name: Start ZAP for browser discovery
      if: env.EXPERIMENT_SCENARIO == 'tuned' || env.EXPERIMENT_SCENARIO == 'tuned-ai'
      run: |
        set -euo pipefail
        mkdir -p artifacts
        ZAP_API_KEY=$(openssl rand -hex 16)
        echo "ZAP_API_KEY=$ZAP_API_KEY" >> "$GITHUB_ENV"
        docker image prune --filter "dangling=true" -f >/dev/null 2>&1 || true
        container_id=$(docker run -d --name zap --network="host" --shm-size=2g --user root \
          --health-cmd "curl -f http://127.0.0.1:8090/JSON/core/view/version/?apikey=$ZAP_API_KEY >/dev/null" \
          --health-interval=30s --health-timeout=5s --health-start-period=15s --health-retries=3 \
          -v "$(pwd):/zap/wrk/:rw" \
          "$ZAP_TUNED_IMAGE" zap.sh -daemon -host 0.0.0.0 -port 8090 \
          -silent \
          -config api.key="$ZAP_API_KEY" \
          -config log.file=/zap/wrk/artifacts/zap-internal.log \
          -config start.checkForUpdates=false \
          -config start.checkAddonUpdates=false \
          -config start.installAddonUpdates=false \
          -config scanner.threadsPerHost=1 \
          -config scanner.threadsPerScan=1 \
          -config scanner.threadPerHost=1 \
          -config scanner.threadPerScan=1 \
          -config autoupdate.check_on_start=false \
          -config autoupdate.install_addon_updates=false)
        echo "Contenedor ZAP: ${container_id}"
        for attempt in {1..60}; do
          if curl --silent --fail \
            "http://127.0.0.1:8090/JSON/core/view/version/?apikey=${ZAP_API_KEY}"; then
            echo
            docker exec zap mkdir -p /tmp/zap-chrome-profile
            docker exec zap sh -c 'rm -rf /tmp/zap-client-profile /tmp/zap-firefox-profile /root/.ZAP/zap-client-profile /root/.ZAP/firefox-profile 2>/dev/null || true'
            docker exec zap sh -c 'timeout 30 chromium --headless=new --no-sandbox --disable-dev-shm-usage --screenshot=/tmp/chrome-check.png about:blank >/tmp/chrome-headless.log 2>&1; echo $?' \
              > artifacts/chrome-headless-check.txt
            docker exec zap cat /tmp/chrome-headless.log > artifacts/chrome-headless.log 2>&1 || true
            docker exec zap chromedriver --version > artifacts/chromedriver-check.txt 2>&1 || true
            docker exec zap sh -c 'chromium --version > /tmp/chrome-check.txt 2>&1; chromedriver --version > /tmp/chromedriver-version.txt 2>&1; cat /tmp/chrome-check.txt /tmp/chromedriver-version.txt' \
              > artifacts/chrome-driver-versions.txt
            docker exec zap sh -c 'chrome_version=$(chromium --version | grep -oE "[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+" | head -n1); driver_version=$(chromedriver --version | grep -oE "[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+" | head -n1); printf "chromium=%s\nchromedriver=%s\n" "$chrome_version" "$driver_version"; test "${chrome_version%%.*}" = "${driver_version%%.*}"' \
              > artifacts/chrome-driver-match.txt 2>&1 || true
            docker exec zap sh -c 'timeout 30 chromedriver --port=4445 --allowed-ips= >/tmp/chromedriver-check.log 2>&1 & driver_pid=$!; sleep 3; curl --silent --fail http://127.0.0.1:4445/status >/tmp/chromedriver-status.json 2>/dev/null || true; kill $driver_pid >/dev/null 2>&1 || true; wait $driver_pid >/dev/null 2>&1 || true' || true
            docker exec zap cat /tmp/chromedriver-check.log > artifacts/chromedriver-check.log 2>&1 || true
            docker exec zap cat /tmp/chromedriver-status.json > artifacts/chromedriver-status.json 2>&1 || true
            exit 0
          fi
          sleep 2
        done
        docker logs zap || true
        docker inspect zap > artifacts/zap-container-inspect.json || true
        exit 1

    - name: Discover SPA requests through ZAP
      if: env.EXPERIMENT_SCENARIO == 'tuned' || env.EXPERIMENT_SCENARIO == 'tuned-ai'
      env:
        ZAP_PROXY: http://127.0.0.1:8090
        ZAP_API_KEY: ${{ env.ZAP_API_KEY }}
        TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        BROWSER_WORKFLOW_REPORT: artifacts/browser-workflow.json
      run: node zap/seed-spa.mjs "$TARGET_URL"

    - name: Run OWASP ZAP Tuned Scan
      if: env.EXPERIMENT_SCENARIO == 'tuned' || env.EXPERIMENT_SCENARIO == 'tuned-ai'
      env:
        ZAP_API_KEY: ${{ env.ZAP_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p artifacts
        scanner_ids=$(awk '!/^[[:space:]]*#/ && NF { print $1 }' zap/active-scan.conf | paste -sd, -)
        if [ -z "$scanner_ids" ]; then
          echo "No se encontraron IDs de Active Scan en zap/active-scan.conf."
          exit 1
        fi
        echo "Scanners activos configurados: ${scanner_ids}"
        curl --silent --show-error --fail \
          "http://127.0.0.1:8090/JSON/ascan/action/disableAllScanners/?apikey=${ZAP_API_KEY}"
        curl --silent --show-error --fail --get \
          --data-urlencode "apikey=${ZAP_API_KEY}" \
          --data-urlencode "ids=${scanner_ids}" \
          "http://127.0.0.1:8090/JSON/ascan/action/enableScanners/"
        curl --silent --show-error --fail \
          "http://127.0.0.1:8090/JSON/ascan/view/scanners/?apikey=${ZAP_API_KEY}" \
          > artifacts/active-scanners.json
        target_regex=$(python - <<'PY'
        import os
        import re
        from urllib.parse import urlparse

        target = urlparse(os.environ["TARGET_URL"])
        origin = f"{target.scheme}://{target.netloc}"
        print(f"^{re.escape(origin)}(?:/.*)?$")
        PY
        )
        curl --silent --show-error --fail --get \
          --data-urlencode "apikey=${ZAP_API_KEY}" \
          --data-urlencode "contextName=target-context" \
          "http://127.0.0.1:8090/JSON/context/action/newContext/"
        curl --silent --show-error --fail --get \
          --data-urlencode "apikey=${ZAP_API_KEY}" \
          --data-urlencode "contextName=target-context" \
          --data-urlencode "regex=${target_regex}" \
          "http://127.0.0.1:8090/JSON/context/action/includeInContext/"
        curl --silent --show-error --fail --get \
          --data-urlencode "apikey=${ZAP_API_KEY}" \
          --data-urlencode "contextName=target-context" \
          --data-urlencode "regex=^https?://github\\.com(?:/.*)?$" \
          "http://127.0.0.1:8090/JSON/context/action/excludeFromContext/"
        curl --silent --show-error --fail --get \
          --data-urlencode "apikey=${ZAP_API_KEY}" \
          --data-urlencode "url=${TARGET_URL}" \
          --data-urlencode "recurse=true" \
          --data-urlencode "inScopeOnly=true" \
          "http://127.0.0.1:8090/JSON/ascan/action/scan/"
        while true; do
          status=$(curl --silent --show-error --fail \
            "http://127.0.0.1:8090/JSON/ascan/view/status/?apikey=${ZAP_API_KEY}" |
            python -c 'import json, sys; print(json.load(sys.stdin)["status"])')
          echo "Estado Active Scan: ${status}%"
          [ "${status}" = "100" ] && break
          sleep 5
        done
        curl --silent --show-error --fail \
          "http://127.0.0.1:8090/OTHER/core/other/jsonreport/?apikey=${ZAP_API_KEY}" \
          > "artifacts/zap-${EXPERIMENT_SCENARIO}.json"
        curl --silent --show-error --fail \
          "http://127.0.0.1:8090/OTHER/core/other/htmlreport/?apikey=${ZAP_API_KEY}" \
          > "artifacts/zap-${EXPERIMENT_SCENARIO}.html"
        test -s "artifacts/zap-${EXPERIMENT_SCENARIO}.json"
      continue-on-error: true

    - name: Filter ZAP report to target origin
      if: env.EXPERIMENT_SCENARIO == 'tuned' || env.EXPERIMENT_SCENARIO == 'tuned-ai'
      run: |
        python - <<'PY'
        import json
        import os
        from urllib.parse import urlparse

        report_path = f"artifacts/zap-{os.environ['EXPERIMENT_SCENARIO']}.json"
        target = urlparse(os.environ["TARGET_URL"])
        target_origin = f"{target.scheme}://{target.netloc}"

        with open(report_path, "r", encoding="utf-8") as source:
            report = json.load(source)

        filtered_sites = []
        for site in report.get("site", []):
            site_name = site.get("@name", "")
            if site_name == target_origin or site_name.startswith(target_origin + "/"):
                filtered_sites.append(site)
        report["site"] = filtered_sites

        with open(report_path, "w", encoding="utf-8") as destination:
            json.dump(report, destination, ensure_ascii=False, indent=2)
        PY

    - name: Capture Juice Shop challenge ground truth
      if: env.EXPERIMENT_SCENARIO == 'tuned' || env.EXPERIMENT_SCENARIO == 'tuned-ai'
      env:
        TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      run: |
        curl --silent --show-error --fail \
          "$TARGET_URL/api/Challenges/" \
          > artifacts/challenges.json

    - name: Save ZAP logs
      if: always() && (env.EXPERIMENT_SCENARIO == 'tuned' || env.EXPERIMENT_SCENARIO == 'tuned-ai')
      run: |
        {
          if docker container inspect zap >/dev/null 2>&1; then
            docker logs zap 2>&1 || true
            docker inspect zap > artifacts/zap-container-inspect.json || true
          else
            echo "El contenedor ZAP no llegó a crearse o ya no existe."
          fi
          docker image inspect "$ZAP_TUNED_IMAGE" > artifacts/zap-image-inspect.json 2>&1 || true
          docker ps -a > artifacts/docker-containers.txt 2>&1 || true
          if [ -f artifacts/zap-internal.log ]; then
            cat artifacts/zap-internal.log
          fi
        } > artifacts/zap.log
        test -s artifacts/zap.log || printf 'ZAP did not produce a log.\n' > artifacts/zap.log
        docker rm -f zap >/dev/null 2>&1 || true

    - name: Set up Python Environment
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install AI triage dependency
      if: env.EXPERIMENT_SCENARIO == 'tuned-ai' || env.EXPERIMENT_SCENARIO == 'baseline'
      run: python -m pip install openai

    - name: Run AI Triage Script
      if: env.EXPERIMENT_SCENARIO == 'tuned-ai' || env.EXPERIMENT_SCENARIO == 'baseline'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        if [ "$EXPERIMENT_SCENARIO" = "baseline" ]; then
          python triage_vulner.py --report artifacts/zap-baseline.json --output artifacts/verified-baseline.html
        else
          python triage_vulner.py --report "artifacts/zap-${EXPERIMENT_SCENARIO}.json" \
            --output "artifacts/verified-${EXPERIMENT_SCENARIO}.html"
        fi

    - name: Write experiment metadata
      if: always()
      run: |
        mkdir -p artifacts
        ajax_spider_enabled=false
        client_spider_enabled=false
        browser_seed_enabled=false
        authenticated_workflow_enabled=false
        cart_workflow_enabled=false
        csrf_validation_enabled=false
        csrf_request_captured=false
        csrf_status=null
        csrf_effect_observed=false
        csrf_vulnerable=false
        csrf_token_present=false
        csrf_outcome=skipped
        csrf_error=null
        csrf_proven=false
        csrf_evidence=null
        csrf_username_before=null
        csrf_username_after=null
        csrf_origin=""
        authentication_error=null
        reflected_xss_workflow_enabled=false
        dom_xss_workflow_enabled=false
        persistent_xss_workflow_enabled=false
        reflected_xss=false
        dom_xss=false
        persistent_xss=false
        reflected_xss_evidence=null
        dom_xss_evidence=null
        persistent_xss_evidence=null
        xss_challenge_events=[]
        sqli_effect_observed=false
        sqli_status=null
        sqli_evidence=null
        if [ "$EXPERIMENT_SCENARIO" = "tuned" ] || [ "$EXPERIMENT_SCENARIO" = "tuned-ai" ]; then
          browser_seed_enabled=true
          authenticated_workflow_enabled=true
          cart_workflow_enabled=true
          reflected_xss_workflow_enabled=true
          dom_xss_workflow_enabled=true
          persistent_xss_workflow_enabled=true
        fi
        if [ -f artifacts/browser-workflow.json ]; then
          csrf_validation_enabled=$(python -c 'import json; print(str(json.load(open("artifacts/browser-workflow.json"))["csrfValidation"]).lower())')
          csrf_request_captured=$(python -c 'import json; print(str(json.load(open("artifacts/browser-workflow.json")).get("csrfRequestCaptured", False)).lower())')
          csrf_status=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/browser-workflow.json")).get("csrfStatus")))')
          csrf_effect_observed=$(python -c 'import json; print(str(json.load(open("artifacts/browser-workflow.json")).get("csrfEffectObserved", False)).lower())')
          csrf_vulnerable=$(python -c 'import json; print(str(json.load(open("artifacts/browser-workflow.json")).get("csrfVulnerable", False)).lower())')
          csrf_token_present=$(python -c 'import json; print(str(json.load(open("artifacts/browser-workflow.json")).get("csrfTokenPresent", False)).lower())')
          csrf_outcome=$(python -c 'import json; print(json.load(open("artifacts/browser-workflow.json")).get("csrfOutcome", "skipped"))')
          csrf_error=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/browser-workflow.json")).get("csrfError")))')
          csrf_proven=$(python -c 'import json; print(str(json.load(open("artifacts/browser-workflow.json")).get("csrfProven", False)).lower())')
          csrf_evidence=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/browser-workflow.json")).get("csrfEvidence")))')
          csrf_username_before=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/browser-workflow.json")).get("csrfUsernameBefore")))')
          csrf_username_after=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/browser-workflow.json")).get("csrfUsernameAfter")))')
          csrf_origin=$(python -c 'import json; print(json.load(open("artifacts/browser-workflow.json")).get("csrfOrigin", ""))')
          authentication_error=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/browser-workflow.json")).get("authenticationError")))')
          reflected_xss=$(python -c 'import json; print(str(json.load(open("artifacts/browser-workflow.json")).get("reflectedXss", False)).lower())')
          dom_xss=$(python -c 'import json; print(str(json.load(open("artifacts/browser-workflow.json")).get("domXss", False)).lower())')
          persistent_xss=$(python -c 'import json; print(str(json.load(open("artifacts/browser-workflow.json")).get("persistentXss", False)).lower())')
          reflected_xss_evidence=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/browser-workflow.json")).get("reflectedXssEvidence")))')
          dom_xss_evidence=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/browser-workflow.json")).get("domXssEvidence")))')
          persistent_xss_evidence=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/browser-workflow.json")).get("persistentXssEvidence")))')
          xss_challenge_events=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/browser-workflow.json")).get("xssChallengeEvents", [])))')
          sqli_effect_observed=$(python -c 'import json; print(str(json.load(open("artifacts/browser-workflow.json")).get("sqliEffectObserved", False)).lower())')
          sqli_status=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/browser-workflow.json")).get("sqliStatus")))')
          sqli_evidence=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/browser-workflow.json")).get("sqliEvidence")))')
        fi
        cat > artifacts/metadata.json <<EOF
        {
          "scenario": "${EXPERIMENT_SCENARIO}",
          "target": "OWASP Juice Shop",
          "target_url": "${TARGET_URL}",
          "zap_image": "${ZAP_IMAGE}",
          "zap_tuned_image": "${ZAP_TUNED_IMAGE}",
          "commit": "${GITHUB_SHA}",
          "ajax_spider_enabled": ${ajax_spider_enabled},
          "client_spider_enabled": ${client_spider_enabled},
          "browser_seed_enabled": ${browser_seed_enabled},
          "authenticated_workflow_enabled": ${authenticated_workflow_enabled},
          "cart_workflow_enabled": ${cart_workflow_enabled},
          "csrf_validation_enabled": ${csrf_validation_enabled},
          "csrf_request_captured": ${csrf_request_captured},
          "csrf_status": ${csrf_status},
          "csrf_effect_observed": ${csrf_effect_observed},
          "csrf_vulnerable": ${csrf_vulnerable},
          "csrf_token_present": ${csrf_token_present},
          "csrf_outcome": "${csrf_outcome}",
          "csrf_error": ${csrf_error},
          "csrf_proven": ${csrf_proven},
          "csrf_evidence": ${csrf_evidence},
          "csrf_username_before": ${csrf_username_before},
          "csrf_username_after": ${csrf_username_after},
          "csrf_origin": "${csrf_origin}",
          "authentication_error": ${authentication_error},
          "reflected_xss_workflow_enabled": ${reflected_xss_workflow_enabled},
          "dom_xss_workflow_enabled": ${dom_xss_workflow_enabled},
          "persistent_xss_workflow_enabled": ${persistent_xss_workflow_enabled},
          "reflected_xss": ${reflected_xss},
          "dom_xss": ${dom_xss},
          "persistent_xss": ${persistent_xss},
          "reflected_xss_evidence": ${reflected_xss_evidence},
          "dom_xss_evidence": ${dom_xss_evidence},
          "persistent_xss_evidence": ${persistent_xss_evidence},
          "xss_challenge_events": ${xss_challenge_events},
          "sqli_effect_observed": ${sqli_effect_observed},
          "sqli_status": ${sqli_status},
          "sqli_evidence": ${sqli_evidence},
          "ai_enabled": $([ "$EXPERIMENT_SCENARIO" = "tuned-ai" ] && echo true || echo false)
        }
        EOF

    - name: Upload experiment artifacts
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: zap-experiment-${{ env.EXPERIMENT_SCENARIO }}
        path: artifacts/
        if-no-files-found: error
