name: Automated Vulnerability & AI Triage Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  security-assessment:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Start OWASP Juice Shop (Target)
      run: |
        docker run -d -p 3000:3000 --name juice-shop-instance bkimminich/juice-shop
        echo "Esperando a que Juice Shop esté en línea..."
        until $(curl --output /dev/null --silent --head --fail http://localhost:3000); do
          printf '.'
          sleep 5
        done
        echo -e "\nJuice Shop está listo para el escaneo."

    - name: Run OWASP ZAP Baseline Scan (Direct Docker Hub)
      run: |
        # Usamos $(pwd) en lugar de la variable de GitHub para asegurar el mapeo físico en Linux
        docker run --rm --network="host" --user root -v $(pwd):/zap/wrk/:rw zaproxy/zap-stable zap-baseline.py -t http://localhost:3000 -J report_json.json
      continue-on-error: true

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      # Forzamos la instalación directa sin validar condiciones previas
      run: |
        python -m pip install --upgrade pip
        pip install openai

    - name: Run AI Triage Script
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python triage_vulner.py --report report_json.json

    - name: Upload AI Verified Report
      uses: actions/upload-artifact@v4
      with:
        name: verified-vulnerabilities-report
        path: verified_alerts.json
